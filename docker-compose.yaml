services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: drinkdb
      POSTGRES_USER: drinkuser
      POSTGRES_PASSWORD: drinkpass
    ports:
      - "5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drinkuser -d drinkdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
      POSTGRES_DB: drinkdb
      POSTGRES_USER: drinkuser
      POSTGRES_PASSWORD: drinkpass
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: >
      sh -c "
        until pg_isready -h $$POSTGRES_HOST -p $$POSTGRES_PORT -U $$POSTGRES_USER; do
          echo 'waiting for db...'; sleep 2;
        done &&
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput --clear &&
        gunicorn backend.wsgi:application --bind 0.0.0.0:8001 --workers 2 --timeout 90 --access-logfile -
      "
    volumes:
      - media_files:/app/media
    expose:
      - "8001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media_files:
