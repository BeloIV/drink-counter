services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: drinkdb
      POSTGRES_USER: drinkuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # No published port: the backend reaches the database on the compose network,
    # and backups run pg_dump through docker exec.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drinkuser -d drinkdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
      POSTGRES_DB: drinkdb
      POSTGRES_USER: drinkuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # The non-superuser role the app connects as; scripts/create-app-db-role.sh sets it up.
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: >
      sh -c "
        until pg_isready -h $$POSTGRES_HOST -p $$POSTGRES_PORT -U $$POSTGRES_USER; do
          echo 'waiting for db...'; sleep 2;
        done &&
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput --clear &&
        gunicorn backend.wsgi:application --bind 0.0.0.0:8001 --workers 2 --timeout 90 --access-logfile - --access-logformat '%({x-real-ip}i)s %(t)s \"%(r)s\" %(s)s %(b)s \"%(a)s\"'
      "
    volumes:
      - media_files:/app/media
    expose:
      - "8001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media_files:

networks:
  default:
    ipam:
      config:
        # Pinned: nginx trusts the Docker gateway range (172.16.0.0/12) for the client
        # address and scheme, and an auto-assigned 192.168.x pool would break both.
        - subnet: 172.30.0.0/16
