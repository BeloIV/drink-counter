# The real client address, for rate limits and Django's login throttle. Public
# requests arrive through Cloudflare, NPM (192.168.16.0/20) and the Docker gateway
# (172.16.0.0/12), each appending to X-Forwarded-For; the first address from the
# right outside them is the client. Anything a client writes into the header itself
# sits further left and is ignored. The LAN is deliberately not trusted.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.16.0/20;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Only the proxies may say the request was HTTPS; a LAN client gets its own scheme.
geo $realip_remote_addr $from_trusted_proxy {
    default        0;
    172.16.0.0/12  1;
}
map $from_trusted_proxy $forwarded_proto {
    1       $http_x_forwarded_proto;
    default $scheme;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    client_max_body_size 20m;   # matches DATA_UPLOAD_MAX_MEMORY_SIZE
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Brute-force brake in front of Django's own throttle.
    location ~ ^/api/auth/(admin-login|google)$ {
        limit_req zone=login burst=5 nodelay;
        error_page 429 = @too_many;   # nginx's own 429 is HTML; the app reads JSON
        proxy_pass http://backend:8001;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Replaces the Vite dev proxy: one origin for the app and the API.
    location /api/ {
        proxy_pass http://backend:8001;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 60s;
    }

    location /media/ {
        # Uploads get a new file name when they change, so browsers may keep them for a week.
        # "private" stops Cloudflare from caching them, which would bypass the Google sign-in.
        # No "always": a 401 before signing in must not be cached.
        add_header Cache-Control "private, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8001;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location @too_many {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        return 429 '{"error":"Príliš veľa pokusov, skús to neskôr."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
