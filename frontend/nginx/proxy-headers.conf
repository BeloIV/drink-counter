proxy_http_version 1.1;
# $http_host is the Host header itself; $host would prefer the host of an
# absolute request line, which a client could use to look like the LAN kiosk.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite, not append: Django trusts exactly one hop (NUM_PROXIES = 1).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
